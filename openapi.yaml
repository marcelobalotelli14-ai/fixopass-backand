openapi: 3.0.3
info:
  title: FIXO PASS API
  description: >
    API de compartilhamento rápido e autorizado de dados entre usuários e empresas.
    O FIXO PASS não é um documento digital e não substitui RG, CPF, CNH ou os
    sistemas das empresas — ele apenas entrega, mediante autorização explícita
    do usuário, os dados que a empresa configurou como necessários.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Ambiente local de desenvolvimento

components:
  securitySchemes:
    CompanyApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Chave de API emitida para a empresa/ERP integrado.
    UserSession:
      type: apiKey
      in: header
      name: X-USER-ID
      description: MVP — identificador do usuário logado no app (substituir por JWT em produção).
    CompanyPanelSession:
      type: apiKey
      in: header
      name: X-COMPANY-ID
      description: MVP — identificador da empresa logada no painel web (diferente da X-API-KEY do ERP).
    AdminSecret:
      type: apiKey
      in: header
      name: X-ADMIN-SECRET
      description: Segredo compartilhado do Super Admin (variável de ambiente ADMIN_SECRET) — acesso a todas as empresas.
    PaymentWebhookSecret:
      type: apiKey
      in: header
      name: X-WEBHOOK-SECRET
      description: Segredo compartilhado do webhook de pagamento (variável de ambiente PAYMENT_WEBHOOK_SECRET) — NÃO é verificação de assinatura oficial do gateway, ver comentário em src/routes/webhooks.ts.
    AsaasWebhookToken:
      type: apiKey
      in: header
      name: asaas-access-token
      description: Token de autenticação do webhook configurado no painel do Asaas (variável de ambiente ASAAS_WEBHOOK_TOKEN). A rota ainda reconsulta o pagamento na API do Asaas antes de ativar a empresa, ver comentário em src/routes/webhooks.ts.
    OAuthClientBasicAuth:
      type: http
      scheme: basic
      description: >
        client_id/client_secret de um OAuthClient do canal WEB/API (ver
        POST /companies/me/integracoes), enviados como Authorization: Basic
        base64(clientId:clientSecret) — RFC 7617/RFC 6749 §2.3.1. Usado
        apenas server-to-server pelo backend do sistema externo — nunca pelo
        navegador do cliente final (neste projeto o client_id também nunca
        vai pro navegador, ver src/routes/oauth.ts).
    OAuthBearerToken:
      type: http
      scheme: bearer
      description: >
        access_token emitido por POST /oauth/token — enviado como
        Authorization: Bearer <access_token> em GET /oauth/userinfo. Curta
        duração (15 minutos), reutilizável dentro da validade.

  schemas:
    Campo:
      type: string
      enum: [NOME, TELEFONE, EMAIL, CPF, RG, DATA_NASCIMENTO, ENDERECO, FOTO]

    AuthRequestInputUserInitiated:
      type: object
      required: [metodo]
      description: Corpo enviado quando quem chama é o APP DO USUÁRIO (autenticado via X-USER-ID), após ler um QR Code ou aproximar o NFC.
      properties:
        metodo:
          type: string
          enum: [NFC, QRCODE]
        qrCodeToken:
          type: string
          description: Token lido do QR Code (identifica empresa + unidade).
        companyId:
          type: string
          format: uuid
          description: Id da empresa lido da tag NFC (usar quando não houver qrCodeToken).
        unidadeId:
          type: string
          format: uuid

    AuthRequestInputCompanyInitiated:
      type: object
      required: [identificador, metodo]
      description: Corpo enviado quando quem chama é o ERP/painel da EMPRESA (autenticado via X-API-KEY), ex. terminal de recepção.
      properties:
        identificador:
          type: object
          properties:
            cpf:
              type: string
            telefone:
              type: string
        unidadeId:
          type: string
          format: uuid
        metodo:
          type: string
          enum: [NFC, QRCODE]
        camposPedidos:
          type: array
          description: Opcional — se omitido, usa os campos configurados pela empresa em /companies/me/campos-solicitados.
          items:
            $ref: '#/components/schemas/Campo'

    AuthRequestOutput:
      type: object
      properties:
        solicitacaoId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDENTE]
        mensagem:
          type: string

    ShareInput:
      type: object
      required: [solicitacaoId, aprovar]
      properties:
        solicitacaoId:
          type: string
          format: uuid
        aprovar:
          type: boolean
        camposLiberados:
          type: array
          items:
            $ref: '#/components/schemas/Campo'

    ShareOutput:
      type: object
      properties:
        status:
          type: string
          enum: [APROVADA, NEGADA]
        dados:
          type: object
          additionalProperties: true
          example:
            nome: "Maria Silva"
            telefone: "+55 19 99999-0000"
            endereco: "Rua das Flores, 123"
        accessCount:
          type: integer
          description: "Nº de pareamentos aprovados do usuário com essa empresa (inclui este). Ausente quando status=NEGADA."
        lastAccessedAt:
          type: string
          format: date-time
          description: "Ausente quando status=NEGADA."

    CustomerDataOutput:
      type: object
      properties:
        dados:
          type: object
          additionalProperties: true
        accessCount:
          type: integer
          description: Nº de pareamentos aprovados desse usuário com essa empresa
        lastAccessedAt:
          type: string
          format: date-time

    Erro:
      type: object
      properties:
        error:
          type: string

paths:
  /users:
    post:
      summary: Cadastro inicial do usuário no app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeCompleto, telefone, email, cpf, senha]
              properties:
                nomeCompleto: { type: string }
                telefone: { type: string }
                email: { type: string, format: email }
                cpf: { type: string }
                rg: { type: string }
                dataNascimento: { type: string, format: date-time }
                endereco: { type: string }
                fotoUrl: { type: string, format: uri }
                senha: { type: string, minLength: 6 }
      responses:
        '201': { description: Usuário criado }
        '400': { description: Dados inválidos }
        '409': { description: E-mail ou CPF já cadastrado }

  /users/login:
    post:
      summary: Login do usuário no app (MVP — retorna userId para header X-USER-ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string }
      responses:
        '200': { description: Login efetuado }
        '401': { description: Credenciais inválidas }

  /users/me:
    get:
      summary: Dados do usuário logado
      security: [{ UserSession: [] }]
      responses:
        '200': { description: Perfil do usuário }
    put:
      summary: Usuário edita seus próprios dados
      security: [{ UserSession: [] }]
      responses:
        '200': { description: Perfil atualizado }
    delete:
      summary: Usuário exclui a própria conta (LGPD) — remove em cascata autorizações, solicitações e logs de acesso
      security: [{ UserSession: [] }]
      responses:
        '204': { description: Conta excluída }
        '401': { description: Usuário não autenticado ou não encontrado }

  /users/me/senha:
    put:
      summary: Troca de senha do usuário logado (exige a senha atual)
      security: [{ UserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual: { type: string }
                novaSenha: { type: string, minLength: 6 }
      responses:
        '204': { description: Senha alterada }
        '401': { description: Senha atual incorreta }

  /users/me/privacidade:
    get:
      summary: Preferências de compartilhamento por categoria de estabelecimento (foto/nome/cpf/rg/dataNascimento/telefone/endereco)
      security: [{ UserSession: [] }]
      responses:
        '200': { description: As 7 categorias (RESTAURANTE..OUTROS + GERAL), com `existe:false` nas ainda não configuradas }
    put:
      summary: Salva (upsert) as regras de privacidade de uma ou mais categorias
      security: [{ UserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categorias]
              properties:
                categorias:
                  type: array
                  items:
                    type: object
                    required: [categoria, foto, nome, cpf, rg, dataNascimento, telefone, endereco]
                    properties:
                      categoria: { type: string, enum: [RESTAURANTE, CONDOMINIO, HOSPITAL, HOTEL, LOJA, OUTROS, GERAL] }
                      foto: { type: boolean }
                      nome: { type: boolean }
                      cpf: { type: boolean }
                      rg: { type: boolean }
                      dataNascimento: { type: boolean }
                      telefone: { type: boolean }
                      endereco: { type: boolean }
      responses:
        '200': { description: Regras salvas }

  /users/me/foto:
    post:
      summary: Envia (ou substitui) a foto de perfil do usuário e atualiza fotoUrl
      security: [{ UserSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
      responses:
        '200':
          description: Foto enviada

  /users/me/autorizacoes:
    get:
      summary: "Tela 'Empresas autorizadas': empresas, dados liberados, data da autorização e contador de pareamentos (accessCount/lastAccessedAt)"
      security: [{ UserSession: [] }]
      responses:
        '200': { description: Lista de autorizações ativas }

  /users/me/autorizacoes/{companyId}:
    delete:
      summary: Usuário revoga o acesso de uma empresa
      security: [{ UserSession: [] }]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Autorização revogada }
        '404': { description: Autorização não encontrada }

  /users/me/push-token:
    put:
      summary: Salva o Expo Push Token do dispositivo (para avisar o usuário quando o ERP cria uma solicitação)
      security: [{ UserSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expoPushToken: { type: string, nullable: true }
      responses:
        '204': { description: Token salvo }
        '400': { description: Dados inválidos }

  /companies:
    post:
      summary: Cadastro da empresa no painel web (retorna a API Key uma única vez)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cnpj, categoria, emailContato, senha]
              properties:
                nome: { type: string }
                cnpj: { type: string }
                categoria:
                  type: string
                  enum: [RESTAURANTE, CONDOMINIO, HOSPITAL, HOTEL, LOJA, OUTROS]
                emailContato: { type: string, format: email }
                senha: { type: string, minLength: 6 }
      responses:
        '201': { description: "Empresa criada (status=TRIAL, trialEndsAt=agora+15 dias), API Key retornada em texto puro, junto com daysLeftInTrial" }
        '409': { description: CNPJ ou e-mail já cadastrado }

  /companies/login:
    post:
      summary: Login do painel web da empresa (MVP — retorna companyId para header X-COMPANY-ID)
      responses:
        '200': { description: Login efetuado }
        '401': { description: Credenciais inválidas }

  /companies/forgot-password:
    post:
      summary: Inicia o fluxo de "esqueci minha senha" do painel web da empresa
      description: >
        Sempre responde 200 com uma mensagem genérica, exista ou não o
        e-mail, para não permitir enumerar e-mails cadastrados. Se a empresa
        existir, gera um token de redefinição (válido por 1 hora) e envia o
        link por e-mail de verdade (Resend ou SMTP, ver src/lib/email.ts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailContato]
              properties:
                emailContato: { type: string, format: email }
      responses:
        '200': { description: Instruções enviadas (se o e-mail existir) }
        '400': { description: Dados inválidos }
        '503': { description: Envio de e-mail não configurado no servidor (nem RESEND_API_KEY nem SMTP_*) }

  /companies/reset-password:
    post:
      summary: Conclui o fluxo de "esqueci minha senha" trocando a senha com o token recebido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, minLength: 6 }
      responses:
        '200': { description: Senha redefinida com sucesso }
        '400': { description: Dados inválidos, token inválido ou expirado }

  /companies/me:
    get:
      summary: "Dados da empresa logada no painel, incluindo status de assinatura (status/trialEndsAt/nextDueDate) e daysLeftInTrial calculado"
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200': { description: Perfil da empresa, campos solicitados e unidades }
    put:
      summary: Empresa edita seus próprios dados cadastrais (nome, CNPJ, e-mail de contato)
      security: [{ CompanyPanelSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                cnpj: { type: string }
                emailContato: { type: string, format: email }
      responses:
        '200': { description: Perfil atualizado }
        '400': { description: Dados inválidos }
        '409': { description: CNPJ ou e-mail já usado por outra empresa }
    delete:
      summary: Encerra a conta da empresa (soft delete — ativa=false; revoga API Key/sessão do painel, desativa NFC/QR Code das unidades, preserva logs de auditoria)
      security: [{ CompanyPanelSession: [] }]
      responses:
        '204': { description: Conta encerrada }

  /companies/me/logo:
    post:
      summary: Envia (ou substitui) a logo da empresa e atualiza logoUrl
      security: [{ CompanyPanelSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoUrl: { type: string, format: uri }
        '400': { description: Nenhum arquivo enviado ou formato/tamanho inválido }

  /companies/me/api-key/regenerate:
    post:
      summary: Gera uma nova API Key para a empresa, invalidando a anterior imediatamente
      description: >
        A API Key nunca é reexibida depois de gerada (só o hash bcrypt é salvo),
        então esta é a única forma de a empresa obter uma API Key de novo caso
        tenha perdido a original. O valor em texto puro só aparece nesta resposta.
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200':
          description: Nova API Key gerada
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  aviso: { type: string }

  /companies/me/campos-solicitados:
    put:
      summary: Empresa define quais dados solicita por padrão (ex. pizzaria x hospital)
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200': { description: Configuração de campos atualizada }

  /companies/me/unidades:
    post:
      summary: Cria uma unidade/filial (gera o token do QR Code)
      security: [{ CompanyPanelSession: [] }]
      responses:
        '201': { description: Unidade criada com qrCodeToken }
    get:
      summary: Lista as unidades da empresa
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200': { description: Lista de unidades }

  /companies/me/unidades/{id}/qrcode:
    get:
      summary: Gera a imagem PNG do QR Code da unidade (para imprimir/exibir no balcão)
      security: [{ CompanyPanelSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Imagem PNG do QR Code
          content:
            image/png:
              schema: { type: string, format: binary }
        '404': { description: Unidade não encontrada }

  /companies/me/unidades/{id}/qrcode-base64:
    get:
      summary: Mesmo QR Code, como data URL base64 dentro de um JSON (para embutir em um <img> no painel React)
      security: [{ CompanyPanelSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Data URL do QR Code
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrCodeDataUrl: { type: string }
        '404': { description: Unidade não encontrada }

  /companies/me/pix:
    post:
      summary: Gera uma cobrança PIX real (Asaas, API v3) para renovar a mensalidade da empresa logada
      description: >
        Cria a cobrança de verdade na API v3 do Asaas (não é um mock) —
        devolve o QR Code (imagem) e o código "copia e cola" pra pagar. A
        confirmação chega depois via POST /webhooks/asaas; esta rota só
        cria a cobrança, não ativa a empresa sozinha.
      security: [{ CompanyPanelSession: [] }]
      responses:
        '201':
          description: Cobrança PIX criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  status: { type: string }
                  qrCode: { type: string, description: "Código PIX copia e cola" }
                  qrCodeBase64: { type: string, description: "Imagem PNG do QR Code, em base64" }
                  valorCentavos: { type: integer }
                  expiraEm: { type: string, format: date-time }
        '404': { description: Empresa não encontrada }
        '503': { description: ASAAS_API_KEY não configurado no servidor }

  /companies/me/compartilhamentos:
    get:
      summary: Histórico de compartilhamentos recebidos (LogAcesso) com os dados atuais do cliente já resolvidos (foto incluída) e o contador de pareamentos (accessCount/lastAccessedAt) de cada cliente com essa empresa
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200':
          description: Até 50 compartilhamentos mais recentes

  /companies/me/webhook:
    put:
      summary: Configura (ou remove) a URL de webhook chamada quando um compartilhamento é aprovado
      security: [{ CompanyPanelSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '200': { description: Webhook configurado }

  /companies/me/integracoes:
    post:
      summary: "[Canal WEB/API] Cria uma integração (ex.: Cardápio Online) — devolve client_secret uma única vez"
      security: [{ CompanyPanelSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, redirectUris]
              properties:
                nome: { type: string }
                redirectUris: { type: array, items: { type: string, format: uri }, minItems: 1, maxItems: 5 }
      responses:
        '201': { description: "Integração criada — resposta inclui clientId e clientSecret (só desta vez)" }
    get:
      summary: "[Canal WEB/API] Lista as integrações da empresa (nunca inclui o client_secret)"
      security: [{ CompanyPanelSession: [] }]
      responses:
        '200': { description: Lista de integrações }

  /companies/me/integracoes/{id}:
    put:
      summary: "[Canal WEB/API] Edita nome e/ou redirectUris de uma integração"
      security: [{ CompanyPanelSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Integração atualizada }
        '404': { description: Integração não encontrada }
    delete:
      summary: "[Canal WEB/API] Revoga a integração — client_id/client_secret param de funcionar imediatamente"
      security: [{ CompanyPanelSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revogada (soft delete — histórico é mantido) }
        '404': { description: Integração não encontrada }

  /companies/me/integracoes/{id}/regenerate-secret:
    post:
      summary: "[Canal WEB/API] Gera um novo client_secret — o anterior para de funcionar"
      security: [{ CompanyPanelSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: "Novo client_secret (só desta vez)" }
        '404': { description: Integração não encontrada }
        '409': { description: Integração revogada }

  /auth/request/{id}:
    get:
      summary: Consulta o status de uma solicitação (alternativa ao webhook, para ERPs que fazem polling)
      security:
        - CompanyApiKey: []
        - UserSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status atual da solicitação }
        '403': { description: Sem permissão para consultar esta solicitação }
        '404': { description: Solicitação não encontrada }

  /auth/request:
    post:
      summary: Cria uma solicitação de compartilhamento (dois fluxos possíveis — ver descrição)
      description: >
        Pode ser chamado de duas formas: (1) pelo APP DO USUÁRIO com header
        X-USER-ID, após ler QR/NFC — usa AuthRequestInputUserInitiated; ou
        (2) pelo ERP/painel da EMPRESA com header X-API-KEY — usa
        AuthRequestInputCompanyInitiated.
      security:
        - UserSession: []
        - CompanyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthRequestInputUserInitiated'
                - $ref: '#/components/schemas/AuthRequestInputCompanyInitiated'
      responses:
        '201':
          description: Solicitação criada, aguardando aprovação do usuário no app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestOutput'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Autenticação ausente ou inválida (nem X-USER-ID nem X-API-KEY)
        '402':
          description: "Assinatura da empresa vencida (TRIAL expirado ou mensalidade em atraso) ou status BLOCKED — pareamento recusado até renovação"
        '404':
          description: Usuário, empresa ou QR Code não encontrado

  /customer/share:
    post:
      summary: Usuário aprova/nega a solicitação e o FIXO PASS envia os dados autorizados
      security:
        - UserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareInput'
      responses:
        '200':
          description: Solicitação resolvida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareOutput'
        '400':
          description: Dados inválidos
        '404':
          description: Solicitação não encontrada
        '409':
          description: Solicitação já havia sido resolvida

  /customer/{id}:
    get:
      summary: Empresa consulta os dados já autorizados de um cliente recorrente
      security:
        - CompanyApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dados autorizados do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDataOutput'
        '401':
          description: API Key ausente ou inválida
        '403':
          description: Nenhuma autorização ativa para este usuário
        '404':
          description: Usuário não encontrado

  /oauth/authorize:
    post:
      summary: "[Canal WEB/API — OAuth2] Sistema externo (ex.: cardápio online) inicia um compartilhamento"
      description: >
        Chamado pelo BACKEND do sistema externo (nunca pelo navegador do
        cliente — client_id nunca é exposto). Equivalente do POST
        /auth/request para o canal Web — a diferença é que aqui ainda não se
        sabe qual usuário vai autorizar; isso só é resolvido quando a pessoa
        abre a authorizationUrl e loga no FIXO PASS. Fluxo authorization_code
        (RFC 6749 §4.1), com a criação do request feita server-to-server em
        vez de um GET público com client_id na query string.
      security:
        - OAuthClientBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_type, redirect_uri]
              properties:
                response_type:
                  type: string
                  enum: [code]
                redirect_uri:
                  type: string
                  format: uri
                  description: Precisa estar entre as redirectUris cadastradas no OAuthClient.
                scope:
                  type: string
                  description: Espaço-separado (RFC 6749 §3.3), ex. "NOME TELEFONE ENDERECO". Opcional — se omitido, usa os campos configurados pela empresa em PUT /companies/me/campos-solicitados. Precisa ser subconjunto desses campos.
                state:
                  type: string
                  description: Opaco, ecoado de volta exatamente como recebido (proteção CSRF do lado do client). Se omitido, o backend usa o requestId como valor de correlação.
                purpose:
                  type: string
                  description: Finalidade em texto livre, mostrada na tela de consentimento (extensão própria, fora do RFC 6749).
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  authorizationUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: "invalid_request/invalid_scope — dados inválidos, redirect_uri não cadastrada ou escopo não permitido para este client"
        '401':
          description: invalid_client — credenciais ausentes ou inválidas
        '403':
          description: access_denied — assinatura da empresa vencida

  /oauth/authorize/{requestId}:
    get:
      summary: "[Canal WEB/API — OAuth2] Tela de consentimento consulta a solicitação"
      description: Chamado pela tela de consentimento (app/authorize.html) já com o usuário logado no FIXO PASS.
      security:
        - UserSession: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes para exibir na tela de consentimento (empresa, finalidade, campos pedidos, status)
        '401':
          description: Usuário não autenticado
        '403':
          description: Solicitação já associada a outro usuário
        '404':
          description: Solicitação não encontrada
    post:
      summary: "[Canal WEB/API — OAuth2] Usuário aprova ou nega a solicitação"
      description: >
        Reaproveita o mesmo núcleo de POST /customer/share — a diferença é
        que NUNCA devolve os dados pro navegador, só um authorization_code
        opaco, de uso único e validade curta (2 minutos), que o backend do
        sistema externo troca em POST /oauth/token.
      security:
        - UserSession: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprovar]
              properties:
                aprovar:
                  type: boolean
                camposLiberados:
                  type: array
                  items:
                    $ref: '#/components/schemas/Campo'
      responses:
        '200':
          description: "Solicitação resolvida — status APROVADA inclui `code`; NEGADA não. `state` é sempre devolvido (o do client, ou requestId como fallback)."
        '400':
          description: Dados inválidos
        '401':
          description: Usuário não autenticado
        '403':
          description: Solicitação não pertence a este usuário
        '404':
          description: Solicitação não encontrada
        '409':
          description: Solicitação já havia sido resolvida (ou expirou)

  /oauth/token:
    post:
      summary: "[Canal WEB/API — OAuth2] Backend do sistema externo troca o authorization_code por um access_token"
      description: >
        RFC 6749 §4.1.3. Diferente de trocar direto por dados, aqui o code
        (uso único) vira um access_token (Bearer, reutilizável dentro da
        validade) — os dados em si só saem em GET /oauth/userinfo.
      security:
        - OAuthClientBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, code, redirect_uri]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                  description: Precisa ser idêntica à usada em POST /oauth/authorize.
      responses:
        '200':
          description: access_token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, description: "Segundos até expirar (900 = 15min)." }
                  scope: { type: string, description: "Espaço-separado, mesmos campos aprovados pelo usuário." }
        '400':
          description: "invalid_request/invalid_grant — código inválido, expirado ou já utilizado; ou redirect_uri não confere"
        '401':
          description: invalid_client — credenciais ausentes ou inválidas
        '403':
          description: invalid_grant — este código não pertence a este client (isolamento multi-tenant)

  /oauth/userinfo:
    get:
      summary: "[Canal WEB/API — OAuth2] Backend do sistema externo obtém os dados autorizados"
      description: >
        Chamado pelo BACKEND do sistema externo (Authorization: Bearer
        <access_token> — sem client_id/client_secret, a posse do token já é
        a credencial, mesmo padrão de um resource server OAuth2/OIDC
        userinfo). Diferente do code, o token é reutilizável: pode ser
        chamado mais de uma vez dentro da validade, sem pedir um novo
        consentimento — é essa reusabilidade que dá o comportamento de "SSO"
        ao canal Web/API.
      security:
        - OAuthBearerToken: []
      responses:
        '200':
          description: Dados autorizados — SOMENTE os campos que o usuário liberou
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >
                      Chaves em minúsculo (nome, telefone, endereco...), só as
                      autorizadas. Quando ENDERECO é autorizado e a pessoa
                      preencheu o endereço estruturado (não só o texto livre
                      antigo do app), vêm também enderecoLogradouro,
                      enderecoNumero, enderecoComplemento, enderecoBairro,
                      enderecoCidade, enderecoEstado e enderecoCep (cada um
                      string ou null) — além de `endereco`, que continua sendo
                      a versão formatada em uma linha só.
                  scope:
                    type: string
        '401':
          description: invalid_token — ausente, inválido, revogado ou expirado

  /webhooks/payment:
    post:
      summary: Confirmação de pagamento (PIX/cartão) — ativa a empresa e soma 30 dias ao vencimento
      description: >
        ATENÇÃO: só confere um segredo compartilhado (X-WEBHOOK-SECRET), NÃO a
        assinatura oficial do Mercado Pago/Asaas — ver aviso de segurança em
        src/routes/webhooks.ts antes de conectar um gateway de verdade.
      security:
        - PaymentWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId: { type: string, format: uuid }
              additionalProperties: true
      responses:
        '200': { description: "Empresa ativada (status=ACTIVE), nextDueDate atualizado" }
        '400': { description: Payload inválido (companyId ausente/inválido) }
        '401': { description: Segredo do webhook inválido }
        '404': { description: Empresa não encontrada }
        '503': { description: PAYMENT_WEBHOOK_SECRET não configurado no servidor }

  /webhooks/mercadopago:
    post:
      summary: Notificação real do Mercado Pago confirmando um pagamento PIX criado em POST /companies/me/pix
      description: >
        Não confia no corpo da notificação — ao receber, consulta o
        pagamento de verdade na API do Mercado Pago (GET /v1/payments/:id)
        usando o MERCADOPAGO_ACCESS_TOKEN do próprio servidor antes de
        ativar qualquer coisa. Aceita tanto o formato novo de webhook
        ({type, data:{id}} no corpo) quanto o IPN legado (?topic=&id= na
        query string). Idempotente: reenvios da mesma notificação não somam
        dias duas vezes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: payment }
                data:
                  type: object
                  properties:
                    id: { type: string }
              additionalProperties: true
      responses:
        '200': { description: "Notificação processada (pode ou não ter resultado em ativação — ver campo 'aplicado' no corpo)" }
        '503': { description: MERCADOPAGO_ACCESS_TOKEN não configurado no servidor }

  /webhooks/asaas:
    post:
      summary: Notificação real do Asaas confirmando um pagamento PIX criado em POST /companies/me/pix
      description: >
        Exige o header `asaas-access-token` batendo com ASAAS_WEBHOOK_TOKEN
        (configurado também no painel do Asaas). Além disso, não confia no
        corpo da notificação — ao receber, consulta o pagamento de verdade
        na API do Asaas (GET /v3/payments/:id) usando o ASAAS_API_KEY do
        próprio servidor antes de ativar qualquer coisa. Escuta os eventos
        PAYMENT_RECEIVED e PAYMENT_CONFIRMED; qualquer outro evento é só
        confirmado com 200 e ignorado. Idempotente: reenvios da mesma
        notificação não somam dias duas vezes.
      security:
        - AsaasWebhookToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, example: PAYMENT_RECEIVED }
                payment:
                  type: object
                  properties:
                    id: { type: string }
              additionalProperties: true
      responses:
        '200': { description: "Notificação processada (pode ou não ter resultado em ativação — ver campo 'aplicado' no corpo)" }
        '401': { description: Token do webhook inválido }
        '503': { description: ASAAS_WEBHOOK_TOKEN ou ASAAS_API_KEY não configurado no servidor }

  /admin/companies:
    get:
      summary: "Super Admin: lista todas as empresas (inclusive encerradas) com status de assinatura, dias de trial e preço"
      security:
        - AdminSecret: []
      responses:
        '200': { description: Lista completa de empresas }
        '401': { description: Segredo de admin inválido }
        '503': { description: ADMIN_SECRET não configurado no servidor }

  /admin/companies/{id}:
    put:
      summary: "Super Admin: edita preço mensal customizado, soma/subtrai dias de trial e/ou troca o status manualmente"
      security:
        - AdminSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                precoMensalCentavos: { type: integer, nullable: true, description: "null volta a usar o preço padrão" }
                diasExtras: { type: integer, description: "positivo soma, negativo subtrai, a partir do trialEndsAt atual (ou de agora)" }
                status: { type: string, enum: [ACTIVE, TRIAL, EXPIRED, BLOCKED] }
      responses:
        '200': { description: Empresa atualizada }
        '400': { description: Nenhum campo informado ou dados inválidos }
        '404': { description: Empresa não encontrada }
    delete:
      summary: "Super Admin: encerra a conta de qualquer empresa (soft delete — mesmo efeito de DELETE /companies/me)"
      security:
        - AdminSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Empresa encerrada }
        '404': { description: Empresa não encontrada }

  /admin/dashboard-stats:
    get:
      summary: "Super Admin: métricas globais (total de empresas, ativas, em teste, inadimplentes, faturamento estimado do mês, volume de pareamentos)"
      security:
        - AdminSecret: []
      responses:
        '200': { description: Métricas agregadas }

  /admin/dados-teste:
    get:
      summary: "Super Admin: preview (não apaga nada) dos cadastros de empresa/usuário identificados como FAKE/TESTE"
      description: >
        Heurística por nome/e-mail/CNPJ/CPF (ver src/lib/limpezaDados.ts) —
        não é uma flag confiável no banco. A conta configurada em
        ADMIN_MASTER_EMAIL/ADMIN_MASTER_CPF nunca aparece aqui.
      security:
        - AdminSecret: []
      responses:
        '200': { description: "Lista de candidatos (companies e users), com o motivo de cada um ter sido identificado" }
    delete:
      summary: "Super Admin: apaga definitivamente os ids de empresa/usuário informados (hard delete, mantém o Admin Master)"
      description: >
        Fluxo esperado: GET /admin/dados-teste, revisar a lista, então DELETE
        com os ids escolhidos + confirmar:true. Reconfirma cada id contra a
        heurística no momento da chamada e nunca apaga a conta do Admin
        Master, mesmo que o id dela venha no corpo.
      security:
        - AdminSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmar]
              properties:
                companyIds: { type: array, items: { type: string, format: uuid } }
                userIds: { type: array, items: { type: string, format: uuid } }
                confirmar: { type: boolean, enum: [true], description: "Obrigatório — confirmação explícita da exclusão definitiva" }
      responses:
        '200': { description: "Contagem apagada e ids ignorados (não batiam mais na heurística, ou eram o Admin Master)" }
        '400': { description: Dados inválidos (nenhum id informado, ou confirmar ausente) }
